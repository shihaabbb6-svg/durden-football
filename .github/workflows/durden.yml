name: Durden Football Radar

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:
  run-durden:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Restore Durden memory
        uses: actions/cache/restore@v4
        with:
          path: |
            trend_memory.json
            live_memory.json
          key: durden-memory-${{ github.run_id }}
          restore-keys: |
            durden-memory-

      - name: Run Durden
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python app.py

      - name: Save Durden memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            trend_memory.json
            live_memory.json
          key: durden-memory-${{ github.run_id }}
